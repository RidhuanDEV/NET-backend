name: modular-net
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modular_net}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-modular_net}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    entrypoint: ["dotnet", "/app/migrator/ModularBackend.Migrator.dll"]
    environment:
      Database__ConnectionString: Host=postgres;Database=${POSTGRES_DB:-modular_net};Username=${POSTGRES_USER:-modular_net};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  app:
    build: .
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: Host=postgres;Database=${POSTGRES_DB:-modular_net};Username=${POSTGRES_USER:-modular_net};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379
      Upload__LocalRoot: /app/uploads
      Upload__Endpoint: ${S3_ENDPOINT_DOCKER-http://minio:9000}
    ports: ["${APP_PORT:-5080}:8080"]
    volumes: ["uploads_data:/app/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  redis:
    image: redis:8.6.1-alpine
    profiles: [redis]
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [s3]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${Upload__AccessKey:?Set Upload__AccessKey}
      MINIO_ROOT_PASSWORD: ${Upload__SecretKey:?Set Upload__SecretKey}
    ports: ["127.0.0.1:${S3_PORT:-19000}:9000", "127.0.0.1:${S3_CONSOLE_PORT:-19001}:9001"]
    volumes: ["s3_data:/data"]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 3s
      retries: 20
  s3-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: [s3]
    environment:
      MC_HOST_dev: http://${Upload__AccessKey}:${Upload__SecretKey}@minio:9000
    command: [mb, --ignore-existing, "dev/${Upload__Bucket:-uploads}"]
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"
volumes:
  postgres_data:
  uploads_data:
  s3_data:
